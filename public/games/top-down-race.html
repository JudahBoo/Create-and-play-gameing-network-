<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Top Down Race</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#f59e0b}
#ui{font-size:13px;color:#94a3b8;margin-bottom:6px}#ui b{color:#e2e8f0}
canvas{border-radius:8px;border:2px solid #1e2340}
#hint{margin-top:8px;font-size:12px;color:#475569}
#btns{margin-top:8px;display:flex;gap:10px}
.btn{padding:10px 20px;border-radius:12px;background:#1e2340;border:1px solid #2d3460;color:#94a3b8;cursor:pointer;font-size:1rem;font-weight:700;touch-action:manipulation}
</style></head><body>
<h1>Road Race 🏎️</h1>
<div id="ui">Score: <b id="sc">0</b> &nbsp; Best: <b id="bst">0</b></div>
<canvas id="c" width="280" height="400"></canvas>
<div id="hint">← → or buttons to steer</div>
<div id="btns"><button class="btn" id="lb">◀</button><button class="btn" id="rb">▶</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=280,H=400,LANES=[60,110,160,210],CW=36,CH=60;
let player,obstacles,score,speed,state='idle',keys={},best=parseInt(localStorage.getItem('toprace_best')||'0'),frame;
function reset(){
  player={x:160,y:H-80,w:CW,h:CH};obstacles=[];score=0;speed=3;state='playing';frame=0;
}
function update(){
  if(state!=='playing')return;
  frame++;score++;speed=3+frame/300;
  document.getElementById('sc').textContent=score;
  if(keys['ArrowLeft']||keys['left'])player.x=Math.max(40,player.x-4);
  if(keys['ArrowRight']||keys['right'])player.x=Math.min(230,player.x+4);
  if(frame%60===0){
    const lx=LANES[Math.floor(Math.random()*LANES.length)];
    obstacles.push({x:lx,y:-CH,w:CW,h:CH,color:['#ef4444','#f97316','#3b82f6'][Math.floor(Math.random()*3)]});
  }
  obstacles.forEach(o=>o.y+=speed);
  obstacles=obstacles.filter(o=>o.y<H+CH);
  for(const o of obstacles){
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y){
      state='dead';if(score>best){best=score;localStorage.setItem('toprace_best',best);}
      document.getElementById('bst').textContent=best;return;
    }
  }
}
function draw(){
  ctx.fillStyle='#374151';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4b5563';ctx.fillRect(40,0,200,H);
  for(let y=(frame*speed)%40-40;y<H;y+=40){ctx.fillStyle='#e2e8f0';ctx.fillRect(137,y,6,24);}
  obstacles.forEach(o=>{ctx.fillStyle=o.color;ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,6);ctx.fill();});
  ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,6);ctx.fill();
  ctx.fillStyle='#a78bfa';ctx.fillRect(player.x+6,player.y+4,8,16);ctx.fillRect(player.x+22,player.y+4,8,16);
  if(state!=='playing'){
    ctx.fillStyle='rgba(7,8,15,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 1.3rem Segoe UI';ctx.textAlign='center';
    ctx.fillText(state==='idle'?'Road Race 🏎️':'Game Over!',W/2,H/2-14);
    ctx.fillStyle='#64748b';ctx.font='0.85rem Segoe UI';
    ctx.fillText(state==='idle'?'Steer to dodge cars!':('Score: '+score+' · Best: '+best),W/2,H/2+14);
  }
}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(state!=='playing')reset();});
document.addEventListener('keyup',e=>delete keys[e.key]);
['lb','rb'].forEach((id,i)=>{
  const k=i===0?'left':'right';
  document.getElementById(id).addEventListener('touchstart',e=>{keys[k]=true;if(state!=='playing')reset();e.preventDefault();},{passive:false});
  document.getElementById(id).addEventListener('touchend',e=>{delete keys[k];e.preventDefault();},{passive:false});
  document.getElementById(id).addEventListener('mousedown',()=>{keys[k]=true;if(state!=='playing')reset();});
  document.getElementById(id).addEventListener('mouseup',()=>delete keys[k]);
});
document.getElementById('bst').textContent=best;
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
