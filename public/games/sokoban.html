<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Sokoban</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;padding:12px;touch-action:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
#ui{font-size:13px;color:#94a3b8;margin-bottom:8px}#ui b{color:#e2e8f0}
canvas{border-radius:8px;image-rendering:pixelated}
#msg{margin-top:8px;font-size:1rem;font-weight:700;color:#22c55e;min-height:24px;text-align:center}
#btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.gbtn{padding:8px 16px;border-radius:16px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;touch-action:manipulation}
.pbtn{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.sbtn{background:#1e2340;color:#94a3b8;border:1px solid #2d3460}
#dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px;margin-top:10px}
.dp{width:48px;height:48px;border-radius:10px;background:#1e2340;border:1px solid #2d3460;color:#94a3b8;font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.dp:active{background:#2d3460}
</style></head><body>
<h1>Sokoban</h1>
<div id="ui">Moves: <b id="mv">0</b> &nbsp; Level: <b id="lv">1</b>/5</div>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="btns"><button class="gbtn sbtn" onclick="undoMove()">↩ Undo</button><button class="gbtn sbtn" onclick="resetLevel()">↺ Reset</button><button class="gbtn pbtn" onclick="nextLevel()">Next ▶</button></div>
<div id="dpad">
  <div></div><div class="dp" onclick="move(0,-1)">▲</div><div></div>
  <div class="dp" onclick="move(-1,0)">◀</div><div class="dp" onclick="resetLevel()">↺</div><div class="dp" onclick="move(1,0)">▶</div>
  <div></div><div class="dp" onclick="move(0,1)">▼</div><div></div>
</div>
<script>
// W=wall #=box .=goal @=player +=player on goal *=box on goal
const LEVELS=[
`#####
#@  #
# $ #
# . #
#####`,
`######
#    #
# $. #
# @  #
######`,
`#######
#     #
# .$. #
# $@$ #
# .$. #
#     #
#######`,
`########
#      #
# .**. #
# *@@* #
# .**. #
#      #
########`,
`########
#   #  #
# $ .  #
#  $#. #
# @    #
########`];
let lvlIdx=0,player,boxes,goals,walls,history,moves;
const CS=36;

function parseLevel(){
  const rows=LEVELS[lvlIdx].trim().split('\n');
  walls=[];boxes=[];goals=[];history=[];moves=0;
  rows.forEach((row,y)=>{
    [...row].forEach((ch,x)=>{
      if(ch==='#')walls.push({x,y});
      else if(ch==='$'||ch==='*')boxes.push({x,y});
      if(ch==='.'||ch==='+'||ch==='*')goals.push({x,y});
      if(ch==='@'||ch==='+')player={x,y};
    });
  });
  document.getElementById('mv').textContent=0;
  document.getElementById('lv').textContent=lvlIdx+1;
  document.getElementById('msg').textContent='';
  const maxX=Math.max(...walls.map(w=>w.x))+1;
  const maxY=Math.max(...walls.map(w=>w.y))+1;
  const c=document.getElementById('c');
  c.width=maxX*CS;c.height=maxY*CS;
  render();
}
function resetLevel(){parseLevel();}
function nextLevel(){lvlIdx=(lvlIdx+1)%LEVELS.length;parseLevel();}
function isWall(x,y){return walls.some(w=>w.x===x&&w.y===y);}
function isBox(x,y){return boxes.findIndex(b=>b.x===x&&b.y===y);}
function move(dx,dy){
  const nx=player.x+dx,ny=player.y+dy;
  if(isWall(nx,ny))return;
  const bi=isBox(nx,ny);
  if(bi!==-1){
    const bx=nx+dx,by=ny+dy;
    if(isWall(bx,by)||isBox(bx,by)!==-1)return;
    history.push({px:player.x,py:player.y,bi,bx:boxes[bi].x,by:boxes[bi].y});
    boxes[bi].x=bx;boxes[bi].y=by;
  } else history.push({px:player.x,py:player.y,bi:-1});
  player.x=nx;player.y=ny;moves++;
  document.getElementById('mv').textContent=moves;
  render();
  if(goals.every(g=>boxes.some(b=>b.x===g.x&&b.y===g.y))){
    document.getElementById('msg').textContent=`🎉 Level ${lvlIdx+1} done! (${moves} moves)`;
    setTimeout(()=>{lvlIdx=(lvlIdx+1)%LEVELS.length;parseLevel();},1200);
  }
}
function undoMove(){
  if(!history.length)return;
  const h=history.pop();
  player.x=h.px;player.y=h.py;
  if(h.bi!==-1){boxes[h.bi].x=h.bx;boxes[h.bi].y=h.by;}
  moves=Math.max(0,moves-1);document.getElementById('mv').textContent=moves;
  render();
}
function render(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  ctx.fillStyle='#07080f';ctx.fillRect(0,0,c.width,c.height);
  walls.forEach(w=>{ctx.fillStyle='#1e2340';ctx.fillRect(w.x*CS,w.y*CS,CS,CS);ctx.strokeStyle='#2d3460';ctx.lineWidth=1;ctx.strokeRect(w.x*CS,w.y*CS,CS,CS);});
  goals.forEach(g=>{ctx.fillStyle='#065f46';ctx.fillRect(g.x*CS+4,g.y*CS+4,CS-8,CS-8);});
  boxes.forEach(b=>{
    const onGoal=goals.some(g=>g.x===b.x&&g.y===b.y);
    ctx.fillStyle=onGoal?'#22c55e':'#f59e0b';
    ctx.fillRect(b.x*CS+3,b.y*CS+3,CS-6,CS-6);
  });
  ctx.fillStyle='#7c3aed';ctx.fillRect(player.x*CS+4,player.y*CS+4,CS-8,CS-8);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(player.x*CS+8,player.y*CS+8,8,8);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move(-1,0);
  else if(e.key==='ArrowRight')move(1,0);
  else if(e.key==='ArrowUp')move(0,-1);
  else if(e.key==='ArrowDown')move(0,1);
  else if(e.key==='z'||e.key==='Z')undoMove();
});
let ts={x:0,y:0};
document.getElementById('c').addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();},{passive:false});
document.getElementById('c').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;
  if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1,0);}else{move(0,dy>0?1:-1);}
  e.preventDefault();
},{passive:false});
parseLevel();
</script></body></html>
