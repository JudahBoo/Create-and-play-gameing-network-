<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Checkers</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;padding:12px}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px}
#ui{font-size:13px;color:#94a3b8;margin-bottom:8px}#ui b{color:#e2e8f0}
canvas{border-radius:8px;cursor:pointer}
#msg{min-height:24px;font-size:0.9rem;font-weight:700;color:#22c55e;margin-top:8px;text-align:center}
.gbtn{padding:8px 22px;border-radius:20px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;touch-action:manipulation;margin-top:8px}
</style></head><body>
<h1>Checkers</h1>
<div id="ui">You 🔴: <b id="rs">12</b> &nbsp; AI ⚫: <b id="bs">12</b></div>
<canvas id="c" width="320" height="320"></canvas>
<div id="msg">Your turn (🔴)</div>
<button class="gbtn" onclick="newGame()">New Game</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const N=8,SZ=40;
// 1=red, 2=black, 3=red king, 4=black king
let board,sel,turn,over;
function newGame(){
  board=Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<3;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]=2;
  for(let r=5;r<8;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]=1;
  sel=null;turn=1;over=false;document.getElementById('msg').textContent='Your turn (🔴)';draw();
}
function isRed(p){return p===1||p===3;}function isBlk(p){return p===2||p===4;}function isKing(p){return p>=3;}
function getColor(p){return isRed(p)?1:isBlk(p)?2:0;}
function getMoves(b,r,c,jump=false){
  const p=b[r][c];if(!p)return[];
  const dirs=[];
  if(isRed(p)||isKing(p))dirs.push([-1,-1],[-1,1]);
  if(isBlk(p)||isKing(p))dirs.push([1,-1],[1,1]);
  const moves=[];
  dirs.forEach(([dr,dc])=>{
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)return;
    if(!b[nr][nc]&&!jump)moves.push({r:nr,c:nc,jump:false});
    else if(b[nr][nc]&&getColor(b[nr][nc])!==getColor(p)){
      const jr=r+dr*2,jc=c+dc*2;
      if(jr>=0&&jr<N&&jc>=0&&jc<N&&!b[jr][jc])moves.push({r:jr,c:jc,jr:nr,jc:nc,jump:true});
    }
  });
  return moves;
}
function allMoves(b,player){
  const m=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c]&&getColor(b[r][c])===player){getMoves(b,r,c).forEach(mv=>m.push({fr:r,fc:c,...mv}));}
  const jumps=m.filter(mv=>mv.jump);return jumps.length?jumps:m;
}
function doMove(b,mv){
  const p=b[mv.fr][mv.fc];b[mv.fr][mv.fc]=0;b[mv.r][mv.c]=p;
  if(mv.jump){b[mv.jr][mv.jc]=0;}
  if(p===1&&mv.r===0)b[mv.r][mv.c]=3;
  if(p===2&&mv.r===7)b[mv.r][mv.c]=4;
}
function counts(b){let r=0,bl=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(isRed(b[i][j]))r++;if(isBlk(b[i][j]))bl++;}return[r,bl];}
function draw(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    ctx.fillStyle=(r+c)%2===0?'#b45309':'#78350f';ctx.fillRect(c*SZ,r*SZ,SZ,SZ);
  }
  const highlights=sel?getMoves(board,sel.r,sel.c).map(m=>`${m.r},${m.c}`):[];
  highlights.forEach(h=>{const[r,c]=h.split(',').map(Number);ctx.fillStyle='rgba(255,255,0,0.3)';ctx.fillRect(c*SZ,r*SZ,SZ,SZ);});
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c];if(!p)continue;
    const cx=c*SZ+SZ/2,cy=r*SZ+SZ/2;
    if(sel&&sel.r===r&&sel.c===c){ctx.beginPath();ctx.arc(cx,cy,SZ/2-3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,0,0.4)';ctx.fill();}
    ctx.beginPath();ctx.arc(cx,cy,SZ/2-5,0,Math.PI*2);ctx.fillStyle=isRed(p)?'#ef4444':'#111';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,SZ/2-8,0,Math.PI*2);ctx.strokeStyle=isRed(p)?'#fca5a5':'#374151';ctx.lineWidth=2;ctx.stroke();
    if(isKing(p)){ctx.fillStyle='#fbbf24';ctx.font='bold 14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',cx,cy);}
  }
  const[r,bl]=counts(board);document.getElementById('rs').textContent=r;document.getElementById('bs').textContent=bl;
}
function doAI(){
  const m=allMoves(board,2);if(!m.length){over=true;document.getElementById('msg').textContent='You win! 🎉';draw();return;}
  const mv=m[Math.floor(Math.random()*m.length)];
  doMove(board,mv);
  const[r,bl]=counts(board);if(!r){over=true;document.getElementById('msg').textContent='AI wins!';draw();return;}
  turn=1;document.getElementById('msg').textContent='Your turn (🔴)';draw();
}
cv.addEventListener('click',e=>{
  if(over||turn!==1)return;
  const rect=cv.getBoundingClientRect();
  const row=Math.floor((e.clientY-rect.top)/SZ),col=Math.floor((e.clientX-rect.left)/SZ);
  if(sel){
    const moves=getMoves(board,sel.r,sel.c);
    const mv=moves.find(m=>m.r===row&&m.c===col);
    if(mv){doMove(board,{fr:sel.r,fc:sel.c,...mv});sel=null;const[r,bl]=counts(board);if(!bl){over=true;document.getElementById('msg').textContent='You win! 🎉';draw();return;}turn=2;document.getElementById('msg').textContent='AI thinking...';draw();setTimeout(doAI,500);return;}
  }
  if(board[row][col]&&isRed(board[row][col])){sel={r:row,c:col};}else{sel=null;}
  draw();
});
newGame();
</script></body></html>
