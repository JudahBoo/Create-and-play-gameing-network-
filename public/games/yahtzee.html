<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Yahtzee</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;padding:16px}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px}
#ui{font-size:13px;color:#94a3b8;margin-bottom:10px}#ui b{color:#e2e8f0}
#dice{display:flex;gap:8px;margin-bottom:12px}
.die{width:52px;height:52px;background:#1e2340;border:2px solid #2d3460;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;touch-action:manipulation;transition:border-color 0.1s}
.die.held{border-color:#22c55e;background:#0f2a1a}
#cats{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-width:320px;width:100%;margin-bottom:10px}
.cat{background:#1e2340;border:1px solid #2d3460;border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px;touch-action:manipulation;transition:border-color 0.1s}
.cat:hover:not(.scored){border-color:#7c3aed}.cat.scored{opacity:0.5;cursor:default}
.cat-name{color:#94a3b8}.cat-val{font-weight:700;color:#e2e8f0}
#msg{font-size:0.9rem;font-weight:700;min-height:22px;text-align:center;margin-bottom:8px;color:#22c55e}
.gbtn{padding:8px 22px;border-radius:20px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;touch-action:manipulation}
</style></head><body>
<h1>Yahtzee</h1>
<div id="ui">Score: <b id="sc">0</b> &nbsp; Rolls left: <b id="rl">3</b> &nbsp; Round: <b id="rd">1</b>/13</div>
<div id="dice"></div>
<div id="cats"></div>
<div id="msg"></div>
<button class="gbtn" id="rollBtn" onclick="roll()">Roll Dice</button>
<script>
const CATS=[
  {id:'ones',name:'Ones',fn:d=>d.filter(v=>v===1).reduce((a,b)=>a+b,0)},
  {id:'twos',name:'Twos',fn:d=>d.filter(v=>v===2).reduce((a,b)=>a+b,0)},
  {id:'threes',name:'Threes',fn:d=>d.filter(v=>v===3).reduce((a,b)=>a+b,0)},
  {id:'fours',name:'Fours',fn:d=>d.filter(v=>v===4).reduce((a,b)=>a+b,0)},
  {id:'fives',name:'Fives',fn:d=>d.filter(v=>v===5).reduce((a,b)=>a+b,0)},
  {id:'sixes',name:'Sixes',fn:d=>d.filter(v=>v===6).reduce((a,b)=>a+b,0)},
  {id:'3oak',name:'3 of a Kind',fn:d=>{const c=counts(d);return Object.values(c).some(n=>n>=3)?d.reduce((a,b)=>a+b,0):0;}},
  {id:'4oak',name:'4 of a Kind',fn:d=>{const c=counts(d);return Object.values(c).some(n=>n>=4)?d.reduce((a,b)=>a+b,0):0;}},
  {id:'fh',name:'Full House',fn:d=>{const v=Object.values(counts(d)).sort();return(v[0]===2&&v[1]===3)?25:0;}},
  {id:'ss',name:'Sm. Straight',fn:d=>{const u=[...new Set(d)].sort();let m=1,b=1;for(let i=1;i<u.length;i++){m=u[i]===u[i-1]+1?m+1:1;b=Math.max(b,m);}return b>=4?30:0;}},
  {id:'ls',name:'Lg. Straight',fn:d=>{const u=[...new Set(d)].sort();return u.length===5&&u[4]-u[0]===4?40:0;}},
  {id:'yz',name:'Yahtzee!',fn:d=>new Set(d).size===1?50:0},
  {id:'ch',name:'Chance',fn:d=>d.reduce((a,b)=>a+b,0)},
];
function counts(d){const c={};d.forEach(v=>c[v]=(c[v]||0)+1);return c;}
const FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let dice,held,rolls,round,scores,total;
function init(){dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=3;round=1;scores={};total=0;render();}
function roll(){
  if(rolls<=0)return;
  dice=dice.map((v,i)=>held[i]?v:Math.ceil(Math.random()*6));
  rolls--;document.getElementById('rl').textContent=rolls;
  document.getElementById('msg').textContent=rolls===0?'Score a category now!':'Click dice to hold';
  document.getElementById('rollBtn').disabled=rolls===0;
  renderDice();renderCats();
}
function renderDice(){
  const el=document.getElementById('dice');el.innerHTML='';
  dice.forEach((v,i)=>{const d=document.createElement('div');d.className='die'+(held[i]?' held':'');d.textContent=FACES[v];d.onclick=()=>{if(rolls<3&&rolls>0){held[i]=!held[i];renderDice();}};el.appendChild(d);});
}
function renderCats(){
  const el=document.getElementById('cats');el.innerHTML='';
  CATS.forEach(cat=>{
    const d=document.createElement('div');d.className='cat'+(scores[cat.id]!==undefined?' scored':'');
    const pv=cat.fn(dice);
    d.innerHTML=`<span class="cat-name">${cat.name}</span><span class="cat-val">${scores[cat.id]!==undefined?scores[cat.id]:(rolls<3?'+'+pv:'—')}</span>`;
    if(scores[cat.id]===undefined&&rolls<3){d.onclick=()=>score(cat.id,pv);}
    el.appendChild(d);
  });
}
function score(id,val){
  scores[id]=val;total+=val;document.getElementById('sc').textContent=total;
  round++;document.getElementById('rd').textContent=round;
  if(round>13){document.getElementById('msg').textContent=`Game over! Final score: ${total}`;document.getElementById('rollBtn').disabled=true;return;}
  dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=3;
  document.getElementById('rl').textContent=3;document.getElementById('rollBtn').disabled=false;
  document.getElementById('msg').textContent='Roll the dice!';renderDice();renderCats();
}
function render(){renderDice();renderCats();document.getElementById('msg').textContent='Roll the dice!';}
init();
</script></body></html>
