<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Hangman</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;padding:12px}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px}
#ui{font-size:13px;color:#94a3b8;margin-bottom:8px}#ui b{color:#e2e8f0}
#gallows{margin-bottom:10px}
#word{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.letter{width:28px;height:34px;border-bottom:2px solid #7c3aed;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#e2e8f0}
#kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:320px;margin-bottom:10px}
.kbtn{width:36px;height:36px;border-radius:6px;border:1px solid #2d3460;background:#1e2340;color:#94a3b8;font-size:0.85rem;font-weight:700;cursor:pointer;touch-action:manipulation;transition:opacity 0.1s}
.kbtn.used{opacity:0.25;pointer-events:none}
.kbtn.correct{background:#065f46;border-color:#22c55e;color:#86efac}
.kbtn.wrong{background:#7c1a1a;border-color:#ef4444;color:#fca5a5}
#msg{font-size:1rem;font-weight:700;color:#22c55e;min-height:24px;text-align:center;margin-bottom:8px}
#hint{font-size:12px;color:#475569;margin-bottom:8px}
.gbtn{padding:8px 20px;border-radius:20px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;touch-action:manipulation}
</style></head><body>
<h1>Hangman</h1>
<div id="ui">Wrong: <b id="wr">0</b>/6 &nbsp; Score: <b id="sc">0</b></div>
<canvas id="gallows" width="160" height="160"></canvas>
<div id="word"></div>
<div id="hint"></div>
<div id="kb"></div>
<div id="msg"></div>
<button class="gbtn" onclick="newGame()">New Word</button>
<script>
const WORDS=[{w:'PLATFORM',h:'game type'},{w:'JOYSTICK',h:'controller part'},{w:'ADVENTURE',h:'game genre'},{w:'MULTIPLAYER',h:'game mode'},{w:'CHARACTER',h:'game entity'},{w:'DUNGEON',h:'game location'},{w:'TREASURE',h:'in-game reward'},{w:'RESPAWN',h:'after dying'},{w:'CHECKPOINT',h:'progress save'},{w:'GRAPHICS',h:'visual quality'},{w:'SOUNDTRACK',h:'game music'},{w:'INVENTORY',h:'item storage'}];
let word,guessed,wrongs,score=0,over;

function newGame(){
  const pick=WORDS[Math.floor(Math.random()*WORDS.length)];
  word=pick.w;guessed=new Set();wrongs=0;over=false;
  document.getElementById('hint').textContent='Hint: '+pick.h;
  document.getElementById('msg').textContent='';document.getElementById('wr').textContent=0;
  drawGallows(0);renderWord();renderKB();
}
function guess(ch){
  if(over||guessed.has(ch))return;
  guessed.add(ch);
  if(!word.includes(ch)){wrongs++;document.getElementById('wr').textContent=wrongs;drawGallows(wrongs);}
  renderWord();renderKB();
  if(word.split('').every(c=>guessed.has(c))){score++;document.getElementById('sc').textContent=score;document.getElementById('msg').textContent='🎉 Got it!';over=true;}
  else if(wrongs>=6){document.getElementById('msg').textContent=`💀 It was: ${word}`;over=true;}
}
function renderWord(){
  const el=document.getElementById('word');el.innerHTML='';
  word.split('').forEach(ch=>{const d=document.createElement('div');d.className='letter';d.textContent=guessed.has(ch)?ch:'';el.appendChild(d);});
}
function renderKB(){
  const el=document.getElementById('kb');el.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{
    const b=document.createElement('button');b.className='kbtn';
    if(guessed.has(ch)){b.classList.add(word.includes(ch)?'correct':'wrong');}
    b.textContent=ch;b.addEventListener('click',()=>guess(ch));el.appendChild(b);
  });
}
function drawGallows(n){
  const c=document.getElementById('gallows'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,160,160);ctx.strokeStyle='#7c3aed';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(20,150);ctx.lineTo(140,150);ctx.stroke(); // base
  ctx.beginPath();ctx.moveTo(50,150);ctx.lineTo(50,20);ctx.stroke(); // pole
  ctx.beginPath();ctx.moveTo(50,20);ctx.lineTo(110,20);ctx.stroke(); // top
  ctx.beginPath();ctx.moveTo(110,20);ctx.lineTo(110,40);ctx.stroke(); // rope
  ctx.strokeStyle='#ef4444';ctx.fillStyle='#ef4444';
  if(n>0){ctx.beginPath();ctx.arc(110,52,12,0,Math.PI*2);ctx.stroke();}
  if(n>1){ctx.beginPath();ctx.moveTo(110,64);ctx.lineTo(110,100);ctx.stroke();}
  if(n>2){ctx.beginPath();ctx.moveTo(110,72);ctx.lineTo(88,90);ctx.stroke();}
  if(n>3){ctx.beginPath();ctx.moveTo(110,72);ctx.lineTo(132,90);ctx.stroke();}
  if(n>4){ctx.beginPath();ctx.moveTo(110,100);ctx.lineTo(90,122);ctx.stroke();}
  if(n>5){ctx.beginPath();ctx.moveTo(110,100);ctx.lineTo(130,122);ctx.stroke();}
}
document.addEventListener('keydown',e=>{if(/^[a-zA-Z]$/.test(e.key))guess(e.key.toUpperCase());});
newGame();
</script></body></html>
