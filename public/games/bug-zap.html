<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Bug Zap</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#22c55e}
#ui{font-size:13px;color:#94a3b8;margin-bottom:6px}#ui b{color:#e2e8f0}
canvas{border-radius:8px;border:2px solid #1e2340;cursor:crosshair}
#hint{margin-top:8px;font-size:12px;color:#475569}</style></head><body>
<h1>Bug Zap ⚡</h1>
<div id="ui">Score: <b id="sc">0</b> &nbsp; Misses: <b id="ms">0</b>/5 &nbsp; Best: <b id="bst">0</b></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="hint">Click/tap to zap the bugs!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=360;
const BUGS=['🐛','🐜','🐝','🦗','🪲','🦟'];
let bugs,zaps,score,misses,state='idle',best=parseInt(localStorage.getItem('bugzap_best')||'0'),frame;
function reset(){bugs=[];zaps=[];score=0;misses=0;state='playing';frame=0;}
function spawnBug(){
  const e=BUGS[Math.floor(Math.random()*BUGS.length)];
  const r=14;
  const x=r+Math.random()*(W-r*2),y=r+Math.random()*(H-r*2);
  const a=Math.random()*Math.PI*2;
  const spd=0.5+Math.random()*1.5;
  bugs.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,emoji:e,life:180+Math.random()*120,age:0,zapped:false,za:0});
}
function update(){
  if(state!=='playing')return;
  frame++;if(frame%40===0&&bugs.filter(b=>!b.zapped).length<8)spawnBug();
  bugs.forEach(b=>{
    if(b.zapped){b.za++;return;}
    b.age++;b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(b.y<b.r||b.y>H-b.r)b.vy*=-1;
    if(b.age>=b.life){misses++;document.getElementById('ms').textContent=misses;b.zapped=true;if(misses>=5){state='dead';if(score>best){best=score;localStorage.setItem('bugzap_best',best);}document.getElementById('bst').textContent=best;}}
  });
  zaps=zaps.filter(z=>z.age<12);zaps.forEach(z=>z.age++);
  bugs=bugs.filter(b=>!(b.zapped&&b.za>15));
}
function draw(){
  ctx.fillStyle='#0a120a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<6;i++)for(let j=0;j<6;j++){ctx.fillStyle='#0d1a0d';ctx.fillRect(i*60,j*60,59,59);}
  bugs.forEach(b=>{
    if(b.zapped)return;
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.emoji,b.x,b.y);
    const pct=b.age/b.life;ctx.fillStyle=pct<0.6?'#22c55e':pct<0.85?'#f59e0b':'#ef4444';
    ctx.fillRect(b.x-14,b.y-20,28*pct,4);
  });
  zaps.forEach(z=>{
    const alpha=1-z.age/12;ctx.fillStyle=`rgba(251,191,36,${alpha})`;
    ctx.font=`${16+z.age}px serif`;ctx.textAlign='center';ctx.fillText('⚡',z.x,z.y);
  });
  document.getElementById('sc').textContent=score;
  if(state!=='playing'){
    ctx.fillStyle='rgba(7,8,15,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 1.3rem Segoe UI';ctx.textAlign='center';
    ctx.fillText(state==='idle'?'Bug Zap ⚡':'Game Over!',W/2,H/2-14);
    ctx.fillStyle='#64748b';ctx.font='0.85rem Segoe UI';
    ctx.fillText(state==='idle'?'Click bugs before they escape!':('Score: '+score+' · Best: '+best),W/2,H/2+14);
  }
}
function zap(x,y){
  if(state!=='playing')return;
  for(let i=bugs.length-1;i>=0;i--){
    const b=bugs[i];if(!b.zapped&&Math.hypot(x-b.x,y-b.y)<b.r+10){
      b.zapped=true;score+=10;zaps.push({x:b.x,y:b.y,age:0});break;
    }
  }
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();if(state!=='playing'){reset();return;}zap(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();if(state!=='playing'){reset();return;}zap(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);},{passive:false});
document.getElementById('bst').textContent=best;
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
