<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Missile Defense</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#ef4444}
#ui{font-size:13px;color:#94a3b8;margin-bottom:6px}#ui b{color:#e2e8f0}
canvas{border-radius:8px;border:2px solid #1e2340;cursor:crosshair}
#hint{margin-top:8px;font-size:12px;color:#475569}</style></head><body>
<h1>Missile Defense 🚀</h1>
<div id="ui">Score: <b id="sc">0</b> &nbsp; Cities: <b id="ct">6</b> &nbsp; Best: <b id="bst">0</b></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="hint">Click/tap to intercept missiles!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=360,GY=H-30;
let missiles,intercepts,explosions,score,cities,state='idle',best=parseInt(localStorage.getItem('missile_best')||'0'),frame;
const CITY_X=[30,80,130,230,280,330];
function reset(){missiles=[];intercepts=[];explosions=[];score=0;cities=6;state='playing';frame=0;}
function spawnMissile(){
  const tx=CITY_X[Math.floor(Math.random()*CITY_X.length)];
  const sx=Math.random()*W;
  const spd=1+Math.random()*1.5;
  const dx=tx-sx,dy=GY-0;const len=Math.hypot(dx,dy);
  missiles.push({x:sx,y:0,vx:dx/len*spd,vy:dy/len*spd,tx,trail:[]});
}
function intercept(x,y){
  if(state!=='playing')return;
  intercepts.push({x:W/2,y:GY-10,tx:x,ty:y,done:false,progress:0});
}
function update(){
  if(state!=='playing')return;
  frame++;if(frame%80===0)spawnMissile();
  missiles.forEach(m=>{m.trail.push({x:m.x,y:m.y});if(m.trail.length>20)m.trail.shift();m.x+=m.vx;m.y+=m.vy;});
  intercepts.forEach(ic=>{if(ic.done)return;ic.progress+=0.06;const t=Math.min(ic.progress,1);ic.cx=ic.x+(ic.tx-ic.x)*t;ic.cy=ic.y+(ic.ty-ic.y)*t;if(ic.progress>=1){ic.done=true;explosions.push({x:ic.tx,y:ic.ty,r:0,max:40});}});
  explosions.forEach(e=>e.r+=3);explosions=explosions.filter(e=>e.r<e.max);
  for(let i=missiles.length-1;i>=0;i--){
    const m=missiles[i];
    let destroyed=false;
    for(const e of explosions){if(Math.hypot(m.x-e.x,m.y-e.y)<e.r+8){score+=20;document.getElementById('sc').textContent=score;destroyed=true;break;}}
    if(destroyed){missiles.splice(i,1);continue;}
    if(m.y>=GY){const ci=CITY_X.findIndex(cx=>Math.abs(cx-m.tx)<20);if(ci>=0&&cities>0){cities--;document.getElementById('ct').textContent=cities;explosions.push({x:m.tx,y:GY,r:0,max:50});}missiles.splice(i,1);if(cities<=0){state='dead';if(score>best){best=score;localStorage.setItem('missile_best',best);}document.getElementById('bst').textContent=best;}}
  }
}
function draw(){
  ctx.fillStyle='#07080f';ctx.fillRect(0,0,W,H);
  for(let i=0;i<20;i++){const sx=(i*137)%W,sy=(i*97)%GY;ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(sx,sy,1,1);}
  ctx.fillStyle='#1e2340';ctx.fillRect(0,GY,W,H-GY);
  CITY_X.forEach((cx,i)=>{if(cities>i){ctx.fillStyle='#3b82f6';ctx.fillRect(cx-10,GY-18,20,18);ctx.fillRect(cx-6,GY-26,12,10);ctx.fillStyle='#fbbf24';ctx.fillRect(cx-2,GY-22,4,4);}});
  missiles.forEach(m=>{
    m.trail.forEach((pt,i)=>{ctx.fillStyle=`rgba(239,68,68,${i/m.trail.length*0.4})`;ctx.fillRect(pt.x-1,pt.y-1,3,3);});
    ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.fill();
  });
  intercepts.forEach(ic=>{if(!ic.done){ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(ic.cx,ic.cy,4,0,Math.PI*2);ctx.fill();}});
  explosions.forEach(e=>{const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);g.addColorStop(0,'rgba(251,191,36,0.8)');g.addColorStop(0.6,'rgba(239,68,68,0.4)');g.addColorStop(1,'rgba(239,68,68,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#6b7280';ctx.fillRect(W/2-6,GY-16,12,16);ctx.beginPath();ctx.moveTo(W/2,GY-16);ctx.lineTo(W/2-10,GY-26);ctx.lineTo(W/2+10,GY-26);ctx.closePath();ctx.fill();
  if(state!=='playing'){
    ctx.fillStyle='rgba(7,8,15,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 1.3rem Segoe UI';ctx.textAlign='center';
    ctx.fillText(state==='idle'?'Missile Defense 🚀':'Game Over!',W/2,H/2-14);
    ctx.fillStyle='#64748b';ctx.font='0.85rem Segoe UI';
    ctx.fillText(state==='idle'?'Click to intercept missiles!':('Score: '+score+' · Best: '+best),W/2,H/2+14);
  }
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();if(state!=='playing'){reset();return;}intercept(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener('touchstart',e=>{e.preventDefault();const r=cv.getBoundingClientRect();if(state!=='playing'){reset();return;}intercept(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);},{passive:false});
document.getElementById('bst').textContent=best;
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
