<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Tic-Tac-Toe</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;padding:12px}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px}
#turn{font-size:13px;color:#94a3b8;margin-bottom:12px}#turn b{color:#e2e8f0}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:min(280px,80vw);width:100%}
.cell{aspect-ratio:1;border-radius:10px;background:#1e2340;border:2px solid #2d3460;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,10vw,3rem);font-weight:900;cursor:pointer;touch-action:manipulation;transition:background 0.1s}
.cell:hover{background:#252b4a}
.cell.win{background:#065f46;border-color:#22c55e}
#score{display:flex;gap:20px;margin-bottom:12px;font-size:13px;color:#94a3b8}#score b{color:#e2e8f0}
#msg{font-size:1rem;font-weight:700;color:#22c55e;min-height:24px;margin-bottom:8px}
#btns{display:flex;gap:10px}
.gbtn{padding:8px 20px;border-radius:20px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;touch-action:manipulation}
.pbtn{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.sbtn{background:#1e2340;color:#94a3b8;border:1px solid #2d3460}
</style></head><body>
<h1>Tic-Tac-Toe</h1>
<div id="score">You (✕): <b id="ps">0</b> &nbsp; AI (○): <b id="as">0</b> &nbsp; Draws: <b id="ds">0</b></div>
<div id="turn">Your turn (✕)</div>
<div id="board"></div>
<div id="msg"></div>
<div id="btns"><button class="gbtn pbtn" onclick="newGame()">New Game</button></div>
<script>
let board,ps=0,as=0,ds=0,over;
function newGame(){board=Array(9).fill('');over=false;document.getElementById('msg').textContent='';document.getElementById('turn').textContent='Your turn (✕)';render();}
function best(b,mark){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const w of wins)if(w.every(i=>b[i]===mark))return w;return null;
}
function minimax(b,isMax){
  if(best(b,'O'))return 10;if(best(b,'X'))return -10;if(b.every(v=>v))return 0;
  let score=isMax?-99:99;
  b.forEach((_,i)=>{if(!b[i]){b[i]=isMax?'O':'X';const s=minimax(b,!isMax);b[i]='';score=isMax?Math.max(score,s):Math.min(score,s);}});
  return score;
}
function aiMove(){
  let best2=-99,move=-1;
  board.forEach((_,i)=>{if(!board[i]){board[i]='O';const s=minimax([...board],false);board[i]='';if(s>best2){best2=s;move=i;}}});
  if(move!==-1){board[move]='O';check('O');}
}
function click(i){if(over||board[i])return;board[i]='X';if(!check('X'))setTimeout(aiMove,200);render();}
function check(mark){
  const w=best(board,mark);
  if(w){over=true;if(mark==='X'){ps++;document.getElementById('ps').textContent=ps;document.getElementById('msg').textContent='You win! 🎉';}else{as++;document.getElementById('as').textContent=as;document.getElementById('msg').textContent='AI wins!';}document.getElementById('turn').textContent='';render(w);return true;}
  if(board.every(v=>v)){over=true;ds++;document.getElementById('ds').textContent=ds;document.getElementById('msg').textContent="Draw!";render();return true;}
  document.getElementById('turn').textContent=mark==='X'?'AI thinking...':'Your turn (✕)';render();return false;
}
function render(winLine){
  const el=document.getElementById('board');el.innerHTML='';
  board.forEach((v,i)=>{const cell=document.createElement('div');cell.className='cell'+(winLine&&winLine.includes(i)?' win':'');cell.textContent=v==='X'?'✕':v==='O'?'○':'';if(!over&&!v)cell.addEventListener('click',()=>click(i));el.appendChild(cell);});
}
newGame();
</script></body></html>
