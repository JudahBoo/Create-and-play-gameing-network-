<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/><link rel="icon" href="data:,"><title>Boat Race</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none;touch-action:none}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#3b82f6}
#ui{font-size:13px;color:#94a3b8;margin-bottom:6px}#ui b{color:#e2e8f0}
canvas{max-width:100%;display:block;border-radius:8px;border:2px solid #1e2340}
#hint{margin-top:8px;font-size:12px;color:#475569}
#btns{margin-top:8px;display:flex;gap:10px}
.btn{padding:10px 20px;border-radius:12px;background:#1e2340;border:1px solid #2d3460;color:#94a3b8;cursor:pointer;font-size:1rem;font-weight:700;touch-action:manipulation}
</style></head><body>
<h1>Boat Race ⛵</h1>
<div id="ui">Score: <b id="sc">0</b> &nbsp; Best: <b id="bst">0</b></div>
<canvas id="c" width="280" height="400"></canvas>
<div id="hint">← → or buttons to steer your boat</div>
<div id="btns"><button class="btn" id="lb">◀</button><button class="btn" id="rb">▶</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=280,H=400;
let player,rocks,score,speed,state='idle',keys={},best=parseInt(localStorage.getItem('boatrace_best')||'0'),frame,wave=0;
function reset(){player={x:W/2,y:H-70,w:30,h:44};rocks=[];score=0;speed=2.5;state='playing';frame=0;}
function update(){
  if(state!=='playing')return;
  frame++;wave+=0.05;score++;speed=2.5+frame/400;
  document.getElementById('sc').textContent=score;
  if(keys['ArrowLeft']||keys['left'])player.x=Math.max(20,player.x-4);
  if(keys['ArrowRight']||keys['right'])player.x=Math.min(W-20,player.x+4);
  if(frame%50===0){rocks.push({x:20+Math.random()*(W-40),y:-30,r:14+Math.random()*10});}
  rocks.forEach(r=>r.y+=speed);rocks=rocks.filter(r=>r.y<H+40);
  for(const r of rocks){if(Math.hypot(player.x-r.x,player.y+10-r.y)<r.r+12){state='dead';if(score>best){best=score;localStorage.setItem('boatrace_best',best);}document.getElementById('bst').textContent=best;return;}}
}
function draw(){
  for(let y=0;y<H;y+=20){
    const wv=Math.sin(wave+y*0.1)*3;
    ctx.fillStyle=y%40===0?'#1d4ed8':'#1e40af';ctx.fillRect(0,y,W,20);
  }
  ctx.fillStyle='rgba(255,255,255,0.05)';for(let i=0;i<8;i++)ctx.fillRect(Math.sin(wave+i)*W/2+W/2-10,(frame*2+i*50)%H,20,3);
  rocks.forEach(r=>{
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fillStyle='#6b7280';ctx.fill();
    ctx.beginPath();ctx.arc(r.x-r.r*0.3,r.y-r.r*0.3,r.r*0.3,0,Math.PI*2);ctx.fillStyle='#9ca3af';ctx.fill();
  });
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.ellipse(0,8,15,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-10,10);ctx.lineTo(10,10);ctx.closePath();ctx.fill();
  ctx.restore();
  if(state!=='playing'){
    ctx.fillStyle='rgba(7,8,15,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 1.3rem Segoe UI';ctx.textAlign='center';
    ctx.fillText(state==='idle'?'Boat Race ⛵':'Crashed! 💥',W/2,H/2-14);
    ctx.fillStyle='#64748b';ctx.font='0.85rem Segoe UI';
    ctx.fillText(state==='idle'?'Dodge the rocks!':('Score: '+score+' · Best: '+best),W/2,H/2+14);
  }
}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(state!=='playing')reset();});
document.addEventListener('keyup',e=>delete keys[e.key]);
['lb','rb'].forEach((id,i)=>{
  const k=i===0?'left':'right';
  document.getElementById(id).addEventListener('touchstart',e=>{keys[k]=true;if(state!=='playing')reset();e.preventDefault();},{passive:false});
  document.getElementById(id).addEventListener('touchend',e=>{delete keys[k];e.preventDefault();},{passive:false});
  document.getElementById(id).addEventListener('mousedown',()=>{keys[k]=true;if(state!=='playing')reset();});
  document.getElementById(id).addEventListener('mouseup',()=>delete keys[k]);
});
document.getElementById('bst').textContent=best;
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script></body></html>
